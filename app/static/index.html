<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Style Transfer Demo</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Neural Style Transfer</h1>
    <p>Choose your style source: upload an image <strong>or</strong> describe the style in words.</p>

    <div class="forms-container">
        <!-- Image‑guided form -->
        <div class="form-card">
            <h2>Image Style</h2>
            <form id="imageForm" enctype="multipart/form-data">
                <div>
                    <label for="contentImageImg">Content Image:</label>
                    <input type="file" id="contentImageImg" name="content_image" accept="image/*" required />
                </div>
                <div>
                    <label for="styleImageImg">Style Image:</label>
                    <input type="file" id="styleImageImg" name="style_image" accept="image/*" required />
                </div>
                <button type="submit">Generate (Image)</button>
            </form>
        </div>

        <!-- Text‑guided form -->
        <div class="form-card">
            <h2>Text Style</h2>
            <form id="textForm" enctype="multipart/form-data">
                <div>
                    <label for="contentImageText">Content Image:</label>
                    <input type="file" id="contentImageText" name="content_image" accept="image/*" required />
                </div>
                <div>
                    <label for="stylePrompt">Style Description:</label>
                    <input type="text" id="stylePrompt" name="style_prompt" placeholder="e.g., 'Van Gogh Starry Night'" required />
                </div>
                <button type="submit">Generate (Text)</button>
            </form>
        </div>
    </div>

    <!-- Shared result display -->
    <div id="resultArea" style="display: none;">
        <h3>Generated Image</h3>
        <img id="resultImage" alt="Stylized result" />
        <br />
        <a id="downloadLink" href="#" download="stylized.jpg">Download</a>
    </div>

    <!-- Shared loading indicator -->
    <div id="loading" style="display: none;">Processing…</div>

    <script src="script.js"></script>
</body>
</html>
