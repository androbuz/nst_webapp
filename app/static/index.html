<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Style Transfer</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>Neural Style Transfer</h1>
    <p>Turn your photos and videos into artwork using an image or a text description as your style.</p>

    <div class="forms-container">
        <!-- Image‑guided form -->
        <div class="form-card">
            <h2>Image Style</h2>
            <form id="imageForm" enctype="multipart/form-data">
                <div>
                    <label for="contentImageImg">Content Image:</label>
                    <input type="file" id="contentImageImg" name="content_file" accept="image/*" required />
                </div>
                <div>
                    <label for="styleImageImg">Style Image:</label>
                    <input type="file" id="styleImageImg" name="style_file" accept="image/*" required />
                </div>
                <button type="submit">Generate</button>
            </form>
        </div>

        <!-- Text‑guided form -->
        <div class="form-card">
            <h2>Text Style</h2>
            <form id="textForm" enctype="multipart/form-data">
                <div>
                    <label for="contentImageText">Content Image:</label>
                    <input type="file" id="contentImageText" name="content_file" accept="image/*" required />
                </div>
                <div>
                    <label for="stylePrompt">Style Description:</label>
                    <input type="text" id="stylePrompt" name="prompt" placeholder="e.g., Van Gogh Starry Night" required />
                </div>
                <button type="submit">Generate</button>
            </form>
        </div>

        <!-- Video-guided form -->
        <div class="form-card">
            <h2>Video Style</h2>
            <form id="videoForm" enctype="multipart/form-data">
                <div>
                    <label for="contentVideo">Content Video:</label>
                    <input type="file" id="contentVideo" name="video_file" accept="video/*" required />
                </div>
                <div>
                    <label for="videoStyleImage">Style Image:</label>
                    <input type="file" id="videoStyleImage" name="style_file" accept="image/*" />
                </div>
                <div>
                    <label for="videoStylePrompt">Style Description:</label>
                    <input type="text" id="videoStylePrompt" name="prompt" placeholder="e.g., Van Gogh Starry Night" />
                </div>
                <p style="font-size: 0.8rem; color: #555;">Provide a Style Image OR Description.</p>
                <button type="submit">Generate</button>
            </form>
        </div>
    </div>

    <!-- Shared result display -->
    <div id="resultArea" style="display: none;">
        <h3>Generated Result</h3>
        
        <!-- Image Output Container -->
        <div id="imageResultContainer">
            <img id="resultImage" alt="Stylized result" style="max-width: 100%;" />
        </div>
        
        <!-- Video Output Container -->
        <div id="videoResultContainer" style="display: none;">
            <video id="resultVideo" controls style="max-width: 100%;">
                <source id="resultVideoSource" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <br />
        <a id="downloadLink" href="#" download="stylized_output">Download</a>
    </div>

    <!-- Shared loading indicator -->
    <div id="loading" style="display: none;">Processing… (Videos may take a moment to process frame-by-frame)</div>

    <script src="/static/script.js"></script>
</body>
</html>
